services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: educonnect-backend
    ports:
      - "4000:4000"
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules # Evita sobreescribir los módulos instalados en Linux
    environment:
      - NODE_ENV=development
      - PORT=4000
    command: npm run dev

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: educonnect-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    environment:
      - NODE_ENV=development
    command: npm run dev